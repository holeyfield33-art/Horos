name: CI

on:
  push:
    branches: [main]
    # Tags matching v* trigger the docker publish job below.
    # Without this entry, GitHub never creates a workflow run for tag pushes
    # and the docker job's `if: startsWith(github.ref, 'refs/tags/v')` can
    # never be satisfied.
    tags: ["v*"]
  pull_request:
    # Only run CI on PRs that target main, not PRs between feature branches.
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Build dist/ FIRST — the router-parity test (test_e2e.py::test_router_parity_pass)
      # shells out to the built TS router. Without dist/ it self-skips, and a skip is
      # not a pass. This step ensures the parity gate actually executes.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci && npm run build

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: cd python/graph-gen-python && python3 -m unittest discover -s tests

  mcp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - name: Compile TS Router (Required for MCP Execution)
        run: |
          npm ci
          npm run build

      - name: Setup Python (3.11)
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install Python Dev Dependencies
        run: |
          pip install -r mcp/requirements-dev.txt

      - name: Run MCP Server Test Suite
        run: |
          cd mcp
          python -m pytest -q

  # Builds and pushes the Docker image to Docker Hub on version tags (v*).
  # Requires DOCKER_USERNAME and DOCKER_PASSWORD repository secrets.
  docker:
    name: Docker
    runs-on: ubuntu-latest
    needs: [typescript, python, mcp]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/horos-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
